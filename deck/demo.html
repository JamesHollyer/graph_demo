<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light dark}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Delos Graph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f6f8fb; --line:#d7dde6; --line2:#e7ebf1;
  --ink:#1a2330; --muted:#5f6d7e; --faint:#8b97a7;
  --accent:#2e6f9e; --accent-ink:#ffffff;
  --ws:#b9741c; --ws-bg:#fff7ea; --proc:#2e6f9e; --proc-bg:#eaf2f9;
  --ok:#2f8f5b; --ok-bg:#e6f4ec; --warn:#c2453d; --warn-bg:#fbe9e7;
  --start:#1f6fd1; --end:#7a3fb5; --sel:#e0a52a;
  --dim:.28;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --panel:#171d25; --panel2:#1d242e; --line:#2b3441; --line2:#232b36;
    --ink:#e6ebf2; --muted:#9aa7b8; --faint:#6b7889;
    --accent:#6fa8d6; --accent-ink:#0f141a;
    --ws:#e0a252; --ws-bg:#2b2416; --proc:#6fa8d6; --proc-bg:#18283a;
    --ok:#5cc08a; --ok-bg:#15291e; --warn:#e5766c; --warn-bg:#331b19;
    --start:#6ea6ee; --end:#b58ae0; --sel:#f0c04a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#171d25; --panel2:#1d242e; --line:#2b3441; --line2:#232b36;
  --ink:#e6ebf2; --muted:#9aa7b8; --faint:#6b7889;
  --accent:#6fa8d6; --accent-ink:#0f141a;
  --ws:#e0a252; --ws-bg:#2b2416; --proc:#6fa8d6; --proc-bg:#18283a;
  --ok:#5cc08a; --ok-bg:#15291e; --warn:#e5766c; --warn-bg:#331b19;
  --start:#6ea6ee; --end:#b58ae0; --sel:#f0c04a;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--proc),var(--ws));display:inline-block}
.chip{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px}
.tabs button{padding:4px 12px;border-radius:4px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
.btn{padding:5px 11px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

/* main */
main{flex:1;display:flex;min-height:0}
.canvas{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,var(--line2) 1px,transparent 1.5px) 0 0/22px 22px, var(--bg);cursor:grab;min-height:280px}
.canvas.dragging{cursor:grabbing}
.canvas svg{width:100%;height:100%;display:block}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1.5px solid}
.legend i.ws{background:var(--ws-bg);border-color:var(--ws)}
.legend i.proc{background:var(--proc-bg);border-color:var(--proc);border-radius:50%}
.legend i.cov{background:var(--ok-bg);border-color:var(--ok);border-radius:50%}
.legend i.gap{background:var(--warn-bg);border-color:var(--warn);border-radius:50%;border-style:dashed}
.legend i.st{border-color:var(--start);background:transparent;box-shadow:0 0 0 2px var(--start) inset}
.legend i.en{border-color:var(--end);background:transparent;box-shadow:0 0 0 2px var(--end) inset}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--sel);border-radius:6px;padding:8px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12);max-width:calc(100% - 24px)}
.banner b{color:var(--ink)}
.canvas-tools{position:absolute;right:12px;top:12px;display:flex;gap:6px}

/* svg nodes */
.edge{fill:none;stroke:var(--faint);stroke-width:1.4;opacity:.75;transition:opacity .25s}
.edge.dimmed{opacity:.12}
.edge.lit{stroke:var(--accent);stroke-width:2;opacity:1}
.node{cursor:pointer;transition:opacity .25s}
.node.dimmed{opacity:var(--dim)}
.node .shape{stroke-width:1.5}
.node.ws .shape{fill:var(--ws-bg);stroke:var(--ws)}
.node.proc .shape{fill:var(--proc-bg);stroke:var(--proc)}
.node.covered .shape{fill:var(--ok-bg);stroke:var(--ok)}
.node.gap .shape{fill:var(--warn-bg);stroke:var(--warn);stroke-dasharray:4 3}
.node.ws.gap .strip{fill:var(--warn)}
.node .ring{fill:none;stroke-width:3;opacity:0}
.node.start .ring{stroke:var(--start);opacity:1}
.node.end .ring{stroke:var(--end);opacity:1}
.node.sel .ring{stroke:var(--sel);opacity:1}
.node .label{font-family:var(--mono);font-size:13px;fill:var(--ink);font-weight:500}
.node .sub{font-family:var(--sans);font-size:10px;fill:var(--muted)}
.node .badge{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
.node.hasdata .dot{fill:var(--ok)}
.node .dot{fill:transparent}
.node:hover .shape{filter:brightness(.96)}
.tag{font-family:var(--mono);font-size:10px;fill:var(--start);font-weight:500}
.tag.end{fill:var(--end)}

/* sidebar */
.side{width:340px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.side-head h2{margin:0;font-size:13px;font-weight:600}
.side-head .count{color:var(--muted);font-size:12px}
.side-body{overflow:auto;flex:1;min-height:0}
.tlist{list-style:none;margin:0;padding:6px}
.tlist li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px;cursor:pointer}
.tlist li:hover{background:var(--panel2)}
.tlist li.active{background:var(--proc-bg)}
.tlist .st{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.tlist .st.pass{background:var(--ok)}
.tlist .st.fail{background:var(--warn)}
.tlist .st.new{background:var(--sel)}
.tlist .nm{font-family:var(--mono);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .n{color:var(--faint);font-size:11px;font-family:var(--mono)}
.detail{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--panel2)}
.detail h3{margin:0;font-family:var(--mono);font-size:12.5px;font-weight:500}
.detail p{margin:0;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:11.5px}
.pill{display:inline-block;padding:1px 6px;border-radius:3px;font-family:var(--mono);font-size:11px;border:1px solid;margin:1px 2px 1px 0}
.pill.s{color:var(--start);border-color:var(--start)}
.pill.e{color:var(--end);border-color:var(--end)}
.pill.w{color:var(--ws);border-color:var(--ws)}
.pill.p{color:var(--proc);border-color:var(--proc)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.pill.bad{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.empty{padding:20px 14px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.field input,.field textarea{font:inherit;font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 7px;width:100%}
.field textarea{min-height:56px;resize:vertical}

/* drawer */
.drawer{border-top:1px solid var(--line);background:var(--panel);height:38%;min-height:150px;display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.drawer-head{display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawer-head h2{margin:0;font-size:13px;font-weight:600}
.status{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.status.ok{color:var(--ok)}
.status.bad{color:var(--warn)}
.drawer-body{flex:1;min-height:0;display:flex}
.trace{width:250px;border-right:1px solid var(--line);overflow:auto;padding:6px}
.trace button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;border-radius:4px;font-family:var(--mono);font-size:11.5px}
.trace button:hover{background:var(--panel2)}
.trace button.active{background:var(--proc-bg)}
.trace .k{width:14px;text-align:center;color:var(--faint)}
.trace .k.ws{color:var(--ws)}
.trace .k.proc{color:var(--proc)}
.trace .ms{margin-left:auto;color:var(--faint);font-size:10.5px}
.tablewrap{flex:1;overflow:auto;padding:10px 14px}
table.data{border-collapse:collapse;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:100%}
table.data th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:4px 10px 4px 0;white-space:nowrap;position:sticky;top:0;background:var(--panel)}
table.data td{padding:4px 10px 4px 0;border-bottom:1px solid var(--line2);white-space:nowrap}
table.data td.num{text-align:right}
table.data th.num{text-align:right}
table.data tr.diff td{background:var(--warn-bg)}
.cap{font-size:12px;color:var(--muted);margin:0 0 8px}
.cap b{color:var(--ink);font-weight:600;font-family:var(--mono)}
pre.proto{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre;color:var(--ink)}
pre.proto .k{color:var(--proc)}
pre.proto .s{color:var(--ws)}
.toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel2)}
@media (max-width:820px){
  main{flex-direction:column}
  .side{width:auto;border-left:0;border-top:1px solid var(--line);max-height:45%}
  .trace{width:170px}
  .top{padding:8px 16px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="logo"></span>Delos Graph <span class="chip">fitcheck/main</span><span class="chip">workspace: jhollyer/subgraph-tests</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-graph" aria-selected="false">Graph</button>
      <button role="tab" id="tab-tests" aria-selected="true">Tests</button>
    </div>
    <div class="spacer"></div>
    <span class="status" id="svcStatus">workflow-service · boq/fitcheck-ws · idle</span>
    <button class="btn primary" id="addTestBtn">＋ Add test</button>
  </header>

  <main>
    <div class="canvas" id="canvas">
      <svg id="svg">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="var(--faint)"></path>
          </marker>
          <marker id="arrLit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"></path>
          </marker>
        </defs>
        <g id="world"></g>
      </svg>
      <div class="canvas-tools">
        <button class="btn small" id="fitBtn" title="Fit graph to view">Fit</button>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="legend">
        <span><i class="ws"></i>workset</span>
        <span><i class="proc"></i>process node</span>
        <span><i class="cov"></i>covered by a test</span>
        <span><i class="gap"></i>no test</span>
        <span><i class="st"></i>start</span>
        <span><i class="en"></i>end</span>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <aside class="side">
      <div class="side-head">
        <h2 id="sideTitle">Tests</h2>
        <span class="count" id="sideCount"></span>
        <div class="spacer"></div>
        <button class="btn small" id="clearSel" hidden>Clear</button>
      </div>
      <div class="side-body" id="sideBody"></div>
      <div class="detail" id="detail" hidden></div>
    </aside>
  </main>

  <section class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <h2 id="drawerTitle">Run</h2>
      <span class="status" id="runStatus"></span>
      <div class="spacer"></div>
      <button class="btn small" id="drawerClose">Close</button>
    </div>
    <div class="drawer-body">
      <div class="trace" id="trace"></div>
      <div class="tablewrap" id="tablewrap"></div>
    </div>
  </section>
</div>

<script>
/* ---------- fixture data (all made up) ---------- */
const FIX = {
  demand_raw: [
    {product:"C4-std", site:"us-e1", wk:[1200,1400,1600,1800]},
    {product:"GX-8",   site:"us-w2", wk:[64,64,96,128]},
    {product:"C4-hi",  site:"eu-w1", wk:[300,300,300,300]},
    {product:"GX-8",   site:"sg-1",  wk:[16,16,16,16]},
  ],
  product_map: [
    {kind:"product", from:"C4-std", to:"cpu-gen4"},
    {kind:"product", from:"C4-hi",  to:"cpu-gen4-hm"},
    {kind:"product", from:"GX-8",   to:"gpu-x8"},
    {kind:"site", from:"us-e1", to:"us-east1"},
    {kind:"site", from:"us-w2", to:"us-west2"},
    {kind:"site", from:"eu-w1", to:"eu-west1"},
  ],
  supply_raw: [
    {product:"cpu-gen4",    region:"us-east1", wk:[2000,2000,2000,2000]},
    {product:"gpu-x8",      region:"us-west2", wk:[96,96,96,96]},
    {product:"cpu-gen4-hm", region:"eu-west1", wk:[400,400,400,400]},
    {product:"gpu-x8",      region:"us-east1", wk:[64,64,64,64]},
    {product:"gpu-x8",      region:"eu-west1", wk:[32,32,32,32]},
  ],
  reservations: [
    {product:"cpu-gen4",    region:"us-east1", wk:[500,500,500,500]},
    {product:"gpu-x8",      region:"us-west2", wk:[16,16,16,16]},
    {product:"cpu-gen4-hm", region:"eu-west1", wk:[150,150,150,150]},
  ],
};
const W = 4; // weeks
const z = ()=>Array(W).fill(0);
const vsub=(a,b)=>a.map((v,i)=>v-b[i]);
const vmin=(a,b)=>a.map((v,i)=>Math.min(v,b[i]));
const vmax0=(a)=>a.map(v=>Math.max(v,0));
const sum=(a)=>a.reduce((s,v)=>s+v,0);
const key=(r)=>r.product+"|"+r.region;

/* ---------- graph definition ---------- */
const WORKSETS = [
  {id:"demand_raw",         name:"demand_raw",         src:"demand tool",   x:40,  y:40},
  {id:"product_map",        name:"product_map",        src:"mapping table", x:40,  y:150},
  {id:"supply_raw",         name:"supply_raw",         src:"supply db",     x:40,  y:330},
  {id:"reservations",       name:"reservations",       src:"supply db",     x:40,  y:440},
  {id:"demand_normalized",  name:"demand_normalized",  x:480, y:95},
  {id:"available_supply",   name:"available_supply",   x:480, y:385},
  {id:"demand_by_region",   name:"demand_by_region",   x:920, y:95},
  {id:"fit_result",         name:"fit_result",         x:1360,y:240},
  {id:"shortfall_by_region",name:"shortfall_by_region",x:1800,y:330},
  {id:"fit_summary",        name:"fit_summary",        x:2240,y:150},
  {id:"alternatives",       name:"alternatives",       x:2240,y:420},
];
const PROCS = [
  {id:"normalize_demand", name:"normalize_demand", inputs:["demand_raw","product_map"], output:"demand_normalized", x:260, y:95,
   fn:(d,m)=>{const pm=Object.fromEntries(m.filter(r=>r.kind==="product").map(r=>[r.from,r.to]));
     return d.map(r=>({product:pm[r.product]||r.product, site:r.site, wk:r.wk.slice()}));}},
  {id:"net_supply", name:"net_supply", inputs:["supply_raw","reservations"], output:"available_supply", x:260, y:385,
   fn:(s,rv)=>{const rm=Object.fromEntries(rv.map(r=>[key(r),r.wk]));
     return s.map(r=>({product:r.product, region:r.region, wk:vsub(r.wk, rm[key(r)]||z())}));}},
  {id:"map_locations", name:"map_locations", inputs:["demand_normalized","product_map"], output:"demand_by_region", x:700, y:95,
   fn:(d,m)=>{const sm=Object.fromEntries(m.filter(r=>r.kind==="site").map(r=>[r.from,r.to]));
     return d.map(r=>({product:r.product, region:sm[r.site]||"unmapped", wk:r.wk.slice()}));}},
  {id:"fit", name:"fit", inputs:["demand_by_region","available_supply"], output:"fit_result", x:1140, y:240,
   fn:(d,a)=>{const am=Object.fromEntries(a.map(r=>[key(r),r.wk]));
     return d.map(r=>{const av=am[key(r)]||z(); return {product:r.product, region:r.region, demand:r.wk.slice(), available:av.slice(), fitted:vmin(r.wk,av)};});}},
  {id:"shortfall", name:"shortfall", inputs:["fit_result"], output:"shortfall_by_region", x:1580, y:330,
   fn:(f)=>f.map(r=>({product:r.product, region:r.region, short:vmax0(vsub(r.demand,r.fitted))})).filter(r=>sum(r.short)>0)},
  {id:"summarize", name:"summarize", inputs:["fit_result","shortfall_by_region"], output:"fit_summary", x:2020, y:150,
   fn:(f,s)=>{const by={}; f.forEach(r=>{const o=by[r.product]||(by[r.product]={product:r.product,demand:0,fitted:0,regions_short:0});
     o.demand+=sum(r.demand); o.fitted+=sum(r.fitted);}); s.forEach(r=>{by[r.product].regions_short++;});
     return Object.values(by).map(o=>({...o, fit_pct:Math.round(100*o.fitted/o.demand)}));}},
  {id:"alt_regions", name:"alt_regions", inputs:["shortfall_by_region","fit_result"], output:"alternatives", x:2020, y:420,
   fn:(s,f)=>{const out=[]; s.forEach(sr=>{f.filter(r=>r.product===sr.product && r.region!==sr.region).forEach(r=>{
     const surplus=vsub(r.available,r.fitted); if(sum(surplus)>0) out.push({product:sr.product, short_in:sr.region, alt_region:r.region, surplus});});}); return out;}},
];
const NODES = {}; WORKSETS.forEach(n=>NODES[n.id]={...n,kind:"ws"}); PROCS.forEach(n=>NODES[n.id]={...n,kind:"proc"});
const EDGES = []; PROCS.forEach(p=>{p.inputs.forEach(i=>EDGES.push([i,p.id])); EDGES.push([p.id,p.output]);});
const OUT = {}, IN = {}; EDGES.forEach(([a,b])=>{(OUT[a]=OUT[a]||[]).push(b);(IN[b]=IN[b]||[]).push(a);});

function reach(seeds, adj){const seen=new Set(seeds); const q=[...seeds]; while(q.length){const n=q.shift();(adj[n]||[]).forEach(m=>{if(!seen.has(m)){seen.add(m);q.push(m);}});} return seen;}
function subgraph(starts, ends){const f=reach(starts,OUT), b=reach(ends,IN); return new Set([...f].filter(n=>b.has(n)));}

/* run a subgraph in memory: returns {data, trace, error} */
function runSubgraph(starts, startData, ends){
  const sg=subgraph(starts,ends); const data={...startData}; const trace=[];
  starts.forEach(s=>trace.push({id:s,kind:"ws",ms:0,note:"input"}));
  for(const p of PROCS){ if(!sg.has(p.id)) continue;
    const missing=p.inputs.filter(i=>!(i in data));
    if(missing.length) return {data,trace,error:`${p.name} needs ${missing.join(", ")} but it is not an input and not produced inside the subgraph`};
    const t0=performance.now(); const out=p.fn(...p.inputs.map(i=>data[i])); const ms=Math.max(1,Math.round((performance.now()-t0)*40+3+Math.random()*9));
    data[p.output]=out; trace.push({id:p.id,kind:"proc",ms}); trace.push({id:p.output,kind:"ws",ms:0,rows:out.length});
  }
  const missingEnds=ends.filter(e=>!(e in data));
  if(missingEnds.length) return {data,trace,error:`end workset ${missingEnds.join(", ")} is not reachable from the start worksets`};
  return {data,trace};
}
const deepEq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

/* ---------- tests (configs) ---------- */
function mkTest(name, desc, starts, ends, startData){
  const inputs = startData || Object.fromEntries(starts.map(s=>[s, FIX[s]]));
  const r = runSubgraph(starts, inputs, ends);
  const expected = Object.fromEntries(ends.map(e=>[e, r.data[e]]));
  return {name, desc, starts, ends, inputs, expected, status:"idle"};
}

/* ---------- render graph ---------- */
const NW=176, NH=46;
function nodeEl(n){
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class",`node ${n.kind}`); g.dataset.id=n.id; g.setAttribute("transform",`translate(${n.x},${n.y})`); g.setAttribute("tabindex","0");
  const r=6;
  const shape = n.kind==="ws"
    ? `<rect class="shape" width="${NW}" height="${NH}" rx="${r}"></rect><rect class="strip" x="0" y="0" width="5" height="${NH}" rx="2" fill="var(--ws)"></rect>`
    : `<path class="shape" d="M10 0 H${NW-10} L${NW} ${NH/2} L${NW-10} ${NH} H10 L0 ${NH/2} Z"></path>`;
  const ring = n.kind==="ws" ? `<rect class="ring" x="-4" y="-4" width="${NW+8}" height="${NH+8}" rx="${r+3}"></rect>`
                             : `<path class="ring" d="M8 -4 H${NW-8} L${NW+5} ${NH/2} L${NW-8} ${NH+4} H8 L-5 ${NH/2} Z"></path>`;
  const sub = n.kind==="ws" ? (n.src?`source · ${n.src}`:"derived") : `${n.inputs.length} in → 1 out`;
  g.innerHTML = ring+shape+
    `<text class="label" x="${n.kind==="ws"?14:18}" y="19">${n.name}</text>
     <text class="sub" x="${n.kind==="ws"?14:18}" y="35">${sub}</text>
     <circle class="dot" cx="${NW-14}" cy="12" r="3.5"></circle>
     <text class="tag" x="${NW/2}" y="-9" text-anchor="middle" data-tag=""></text>`;
  return g;
}
function edgePath(a,b){const x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2; const c=Math.max(40,(x2-x1)/2); return `M${x1} ${y1} C${x1+c} ${y1} ${x2-c} ${y2} ${x2} ${y2}`;}
function renderGraph(){
  world.innerHTML="";
  EDGES.forEach(([a,b])=>{const p=document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("class","edge"); p.setAttribute("d",edgePath(NODES[a],NODES[b])); p.setAttribute("marker-end","url(#arr)"); p.dataset.e=a+">"+b; world.appendChild(p);});
  Object.values(NODES).forEach(n=>world.appendChild(nodeEl(n)));
}
function coverage(){const cov=new Set(); TESTS.forEach(t=>subgraph(t.starts,t.ends).forEach(n=>cov.add(n))); return cov;}
function paint(){
  const cov=coverage(); const ti=S.hoverTest!=null?S.hoverTest:S.activeTest; const t=ti!=null?TESTS[ti]:null; const sg=t?subgraph(t.starts,t.ends):null;
  const pickSet=new Set([...S.pickStarts,...S.pickEnds]);
  const litEdges=new Set(); if(sg) EDGES.forEach(([a,b])=>{if(sg.has(a)&&sg.has(b)) litEdges.add(a+">"+b);});
  world.querySelectorAll(".node").forEach(el=>{
    const id=el.dataset.id, n=NODES[id]; el.classList.remove("covered","gap","start","end","sel","dimmed","hasdata");
    if(S.view==="tests") el.classList.add(cov.has(id)?"covered":"gap");
    if(t){ if(t.starts.includes(id)) el.classList.add("start"); else if(t.ends.includes(id)) el.classList.add("end"); if(!sg.has(id)) el.classList.add("dimmed"); }
    if(S.mode==="add"){ if(S.pickStarts.includes(id)) el.classList.add("start"); if(S.pickEnds.includes(id)) el.classList.add("end"); if(n.kind==="proc") el.classList.add("dimmed"); }
    if(S.selNode===id) el.classList.add("sel");
    if(S.run && S.run.data[id]) el.classList.add("hasdata");
    const tag=el.querySelector(".tag"); tag.textContent=""; tag.classList.remove("end");
    if(el.classList.contains("start")) tag.textContent="start"; if(el.classList.contains("end")){tag.textContent="end";tag.classList.add("end");}
  });
  world.querySelectorAll(".edge").forEach(e=>{e.classList.toggle("lit",litEdges.has(e.dataset.e)); e.classList.toggle("dimmed",!!sg&&!litEdges.has(e.dataset.e)); e.setAttribute("marker-end",litEdges.has(e.dataset.e)?"url(#arrLit)":"url(#arr)");});
  void pickSet;
}

/* ---------- pan / zoom ---------- */
const svg=$("svg"), canvas=$("canvas"); let view={x:0,y:0,k:1}; let drag=null;
function applyView(){world.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`);}
function fitView(){const bw=2240+NW+40, bh=500; const r=canvas.getBoundingClientRect();
  const uw=r.width, uh=r.height-40; view.k=Math.min(uw/bw, uh/bh)*0.97; view.x=(uw-bw*view.k)/2 + 20; view.y=(uh-bh*view.k)/2 + 10; applyView();}
function focusNodes(ids){ if(!ids.length) return; const xs=ids.map(i=>NODES[i].x), ys=ids.map(i=>NODES[i].y);
  const minx=Math.min(...xs)-60, maxx=Math.max(...xs)+NW+60, miny=Math.min(...ys)-70, maxy=Math.max(...ys)+NH+60;
  const r=canvas.getBoundingClientRect(); const uw=r.width, uh=r.height-40; const k=Math.min(uw/(maxx-minx), uh/(maxy-miny), 1.5);
  view={k, x:(uw-(maxx-minx)*k)/2 - minx*k, y:(uh-(maxy-miny)*k)/2 - miny*k}; applyView();}
canvas.addEventListener("pointerdown",e=>{if(e.target.closest(".node")||e.target.closest("button")) return; drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; canvas.classList.add("dragging"); canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointermove",e=>{if(!drag) return; view.x=drag.vx+(e.clientX-drag.x); view.y=drag.vy+(e.clientY-drag.y); applyView();});
canvas.addEventListener("pointerup",()=>{drag=null; canvas.classList.remove("dragging");});
canvas.addEventListener("wheel",e=>{e.preventDefault(); const r=canvas.getBoundingClientRect();
  const px=(e.clientX-r.left), py=(e.clientY-r.top); const f=Math.exp(-e.deltaY*0.0015); const k=Math.min(3,Math.max(.15,view.k*f)); const q=k/view.k;
  view={k, x:px-(px-view.x)*q, y:py-(py-view.y)*q}; applyView();},{passive:false});
$("fitBtn").onclick=fitView;
window.addEventListener("resize",()=>{ if(S.activeTest!=null) focusNodes([...subgraph(TESTS[S.activeTest].starts,TESTS[S.activeTest].ends)]); else fitView(); });

function selectTest(i){ S.hoverTest=null; S.activeTest = (S.activeTest===i)?null:i; S.traceSel=null; if(S.run && S.run.test!==S.activeTest) S.run=null; paint(); renderSide();
  if(S.activeTest!=null) focusNodes([...subgraph(TESTS[i].starts,TESTS[i].ends)]); else fitView(); }

/* ---------- tables ---------- */
function rowsToTable(rows, diffIdx){
  if(!rows||!rows.length) return `<p class="muted">0 rows</p>`;
  const cols=[]; rows.forEach(r=>Object.keys(r).forEach(k=>{if(!cols.includes(k))cols.push(k);}));
  const expanded=[]; cols.forEach(c=>{const v=rows.find(r=>Array.isArray(r[c]))?.[c]; if(v) v.forEach((_,i)=>expanded.push({c,i,label:`${c}[w${i+1}]`,num:true})); else expanded.push({c,label:c,num:typeof rows[0][c]==="number"});});
  return `<table class="data"><thead><tr>${expanded.map(e=>`<th class="${e.num?"num":""}">${esc(e.label)}</th>`).join("")}</tr></thead><tbody>${
    rows.map((r,ri)=>`<tr class="${diffIdx&&diffIdx.has(ri)?"diff":""}">${expanded.map(e=>{const v=e.i!=null?(r[e.c]||[])[e.i]:r[e.c]; return `<td class="${e.num?"num":""}">${v==null?"":esc(v)}</td>`;}).join("")}</tr>`).join("")}</tbody></table>`;
}
function openDrawer(title, status, cls){ $("drawer").hidden=false; $("drawerTitle").textContent=title; const s=$("runStatus"); s.textContent=status||""; s.className="status "+(cls||""); }
$("drawerClose").onclick=()=>{$("drawer").hidden=true;};
function showInputs(t){ openDrawer(`Inputs · ${t.name}`,"start worksets as written in the test config"); $("trace").innerHTML=t.starts.map(s=>`<button data-s="${s}"><span class="k ws">▤</span>${s}</button>`).join("");
  const show=(s)=>{ $("trace").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.s===s)); $("tablewrap").innerHTML=`<p class="cap"><b>${s}</b> · input rows</p>`+rowsToTable(t.inputs[s]); };
  $("trace").querySelectorAll("button").forEach(b=>b.onclick=()=>show(b.dataset.s)); show(t.starts[0]); }
function protoRows(rows,ind){ return rows.map(r=>`${ind}rows { ${Object.entries(r).map(([k,v])=>Array.isArray(v)?`${k}: [${v.join(", ")}]`:`${k}: ${typeof v==="number"?v:`"${v}"`}`).join("  ")} }`).join("\n"); }
function testProto(t){
  return `<span class="k">test</span> {\n  <span class="k">name</span>: <span class="s">"${t.name}"</span>\n  <span class="k">description</span>: <span class="s">"${esc(t.desc)}"</span>\n`+
    t.starts.map(s=>`  <span class="k">start</span> {\n    <span class="k">workset</span>: <span class="s">"${s}"</span>\n${esc(protoRows(t.inputs[s],"    "))}\n  }`).join("\n")+"\n"+
    t.ends.map(e=>`  <span class="k">end</span> {\n    <span class="k">workset</span>: <span class="s">"${e}"</span>\n${esc(protoRows(t.expected[e],"    "))}\n  }`).join("\n")+"\n}";
}
function showConfig(t){ openDrawer(`Config · subgraph_tests.textproto`,`fitcheck/tests/subgraph_tests.textproto · ${t.status==="new"?"unsubmitted change in your workspace":"checked in"}`); $("trace").innerHTML=`<button class="active"><span class="k">≡</span>${t.name}</button>`; $("tablewrap").innerHTML=`<pre class="proto">${testProto(t)}</pre>`; }

/* ---------- run ---------- */
function setSvc(text, cls){const s=$("svcStatus"); s.textContent=text; s.className="status "+(cls||"");}
async function runTest(i){
  const t=TESTS[i]; S.activeTest=i; S.run=null; paint();
  openDrawer(`Run · ${t.name}`,"calling workflow-service RunSubgraph { mode: IN_MEMORY } …"); $("trace").innerHTML=""; $("tablewrap").innerHTML="";
  setSvc("workflow-service · boq/fitcheck-ws · RunSubgraph in flight","");
  await new Promise(r=>setTimeout(r,380));
  const res=runSubgraph(t.starts,t.inputs,t.ends); const total=res.trace.reduce((s,x)=>s+x.ms,0)+14;
  let pass=!res.error; const diffs={};
  if(!res.error) t.ends.forEach(e=>{ if(!deepEq(res.data[e],t.expected[e])){pass=false; const d=new Set(); (res.data[e]||[]).forEach((r,ri)=>{ if(!deepEq(r,(t.expected[e]||[])[ri])) d.add(ri); }); diffs[e]=d;} });
  t.status=pass?"pass":"fail"; S.run={test:i,...res,diffs}; paint(); renderSide();
  openDrawer(`Run · ${t.name}`, res.error?`error: ${res.error}`:`${pass?"PASS":"FAIL"} · ${res.trace.filter(x=>x.kind==="proc").length} process nodes · ${total} ms · in-memory, nothing persisted`, res.error||!pass?"bad":"ok");
  setSvc("workflow-service · boq/fitcheck-ws · idle");
  const tr=$("trace"); tr.innerHTML=res.trace.map((x,k)=>`<button data-k="${k}"><span class="k ${x.kind}">${x.kind==="ws"?"▤":"⬢"}</span>${x.id}<span class="ms">${x.kind==="proc"?x.ms+" ms":x.rows!=null?x.rows+" rows":"input"}</span></button>`).join("");
  const show=(k)=>{ S.traceSel=k; tr.querySelectorAll("button").forEach(b=>b.classList.toggle("active",+b.dataset.k===k)); const x=res.trace[k];
    if(x.kind==="proc"){ const p=NODES[x.id]; $("tablewrap").innerHTML=`<p class="cap"><b>${x.id}</b> · process node · read ${p.inputs.map(i=>`<b>${i}</b>`).join(", ")} → wrote <b>${p.output}</b> in ${x.ms} ms</p><p class="muted">Select a workset in the trace to see the rows it held at this point in the run.</p>`; return; }
    const isEnd=t.ends.includes(x.id); const d=diffs[x.id];
    $("tablewrap").innerHTML=`<p class="cap"><b>${x.id}</b> · ${t.starts.includes(x.id)?"input workset":isEnd?"end workset · actual"+(d?" (rows that differ from expected are highlighted)":" · matches expected"):"intermediate workset"} · ${(res.data[x.id]||[]).length} rows</p>`+rowsToTable(res.data[x.id], d)+
      (isEnd?`<p class="cap" style="margin-top:14px"><b>${x.id}</b> · expected</p>`+rowsToTable(t.expected[x.id]):"");
    S.selNode=null; paint(); world.querySelector(`.node[data-id="${x.id}"]`)?.classList.add("sel"); };
  tr.querySelectorAll("button").forEach(b=>b.onclick=()=>show(+b.dataset.k));
  const endK=res.trace.findIndex(x=>t.ends.includes(x.id)); show(endK>=0?endK:res.trace.length-1);
}

    const sugg = S.pickStarts.map(s=>s).join("_");
    html+=`<div class="field"><label>name</label><input id="fName" value="${esc(S.pickEnds[0])}_from_${esc(sugg)}"></div>
      <div class="field"><label>description</label><textarea id="fDesc">Runs ${procs.join(", ")} from ${S.pickStarts.join(", ")} and checks ${S.pickEnds.join(", ")}.</textarea></div>
      <div class="field"><label>input data</label><div class="row"><span class="pill w">sample rows from ${S.pickStarts.length} fixture${S.pickStarts.length>1?"s":""}</span></div><p class="muted" style="margin:0">Prefilled from the workset fixtures. Edit after it is written, or hand the config to an AI to vary the rows.</p></div>
      <div class="field"><label>expected data</label><div class="row"><button class="btn small" id="suggestBtn">Suggest from a run</button><span class="muted" id="suggestNote">not set</span></div></div>
      <div class="row" style="margin-top:6px"><button class="btn primary small" id="writeBtn" disabled>Write test to workspace</button><button class="btn small" id="cancelAdd2">Cancel</button></div>`;
  } else html+=`<p class="muted">${S.addStage==="starts"?"Click worksets on the graph to use as inputs.":"Click the worksets whose rows the test should assert on."}</p>`;
  html+=`</div>`; body.innerHTML=html;
  if(S.addStage==="data"){
    const inputs=Object.fromEntries(S.pickStarts.map(s=>[s, (S.run&&S.run.data[s])||FIX[s]||sampleFor(s)]));
    let expected=null;
    $("suggestBtn").onclick=async()=>{ setSvc("workflow-service · boq/fitcheck-ws · RunSubgraph in flight"); $("suggestNote").textContent="running…"; await new Promise(r=>setTimeout(r,320)); setSvc("workflow-service · boq/fitcheck-ws · idle");
      const r=runSubgraph(S.pickStarts,inputs,S.pickEnds); if(r.error){ $("suggestNote").textContent=""; $("suggestNote").innerHTML=`<span class="pill bad">validation</span> ${esc(r.error)}`; return; }
      expected=Object.fromEntries(S.pickEnds.map(e=>[e,r.data[e]])); $("suggestNote").innerHTML=S.pickEnds.map(e=>`<span class="pill ok">${e} · ${r.data[e].length} rows</span>`).join(""); $("writeBtn").disabled=false; };
    $("cancelAdd2").onclick=cancelAdd;
    $("writeBtn").onclick=()=>{ const t={name:$("fName").value.trim()||"new_test", desc:$("fDesc").value.trim(), starts:[...S.pickStarts], ends:[...S.pickEnds], inputs, expected, status:"new"};
      TESTS.push(t); S.mode=null; S.pickStarts=[]; S.pickEnds=[]; S.activeTest=TESTS.length-1; paint(); renderSide(); showConfig(t); focusNodes([...subgraph(t.starts,t.ends)]); toast(`Wrote ${t.name} to subgraph_tests.textproto`); };
  }
}
function sampleFor(id){ /* derived workset with no fixture: produce rows by running from the sources */ const r=runSubgraph(Object.keys(FIX),FIX,[id]); return r.data[id]||[]; }
$("addTestBtn").onclick=()=>{ if(S.mode==="add") cancelAdd(); else startAdd(); };

/* ---------- tabs, toast, keys ---------- */
function setView(v){ S.view=v; $("tab-graph").setAttribute("aria-selected",v==="graph"); $("tab-tests").setAttribute("aria-selected",v==="tests"); paint(); }
$("tab-graph").onclick=()=>setView("graph"); $("tab-tests").onclick=()=>setView("tests");
let toastT; function toast(m){const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200);}
document.addEventListener("keydown",e=>{ if(e.target.matches("input,textarea")) return; if(e.key==="Escape"){ if(S.mode==="add") cancelAdd(); else {S.selNode=null;S.activeTest=null;S.run=null;paint();renderSide();fitView();} } if(e.key==="f") fitView(); });

/* ---------- boot ---------- */
renderGraph(); paint(); renderSide(); requestAnimationFrame(fitView);
</script>
</body>
</html>
